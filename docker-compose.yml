services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
      # UTC+1 sans heure d'ete. Le meme reglage que le serveur et les tests.
      TZ: Africa/Douala
    ports: ["5432:5432"]
    volumes: ["catalog_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["catalog_minio:/data"]

volumes:
  catalog_pg:
  catalog_minio:
