services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: swap
      POSTGRES_PASSWORD: swap
      POSTGRES_DB: swap
    ports: ["5432:5432"]
    volumes: ["swap_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swap"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["swap_minio:/data"]

volumes:
  swap_pg:
  swap_minio:
