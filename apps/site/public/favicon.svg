<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horizon Services Sarl">
  <!--
    Le monogramme d'Horizon Services Sarl — ADR 0045.

    Le « H » reste l'initiale du mot-marque : la denomination a pris « SARL »
    (ADR 0046), pas une lettre de plus a 16 px.

    Le « H » est dessine en RECTANGLES, pas ecrit en <text>. Une favicon
    n'embarque pas sa police : un <text font-family="Georgia"> rendrait un
    Georgia ici, un Arial ailleurs, et rien du tout sur un poste depouille.
    Les rectangles rendent la meme forme partout.

    Empattements EPAIS (5/64), et c'est le point : a 16 px d'ecran, un
    empattement fin disparait dans le lissage et le serif devient un batons
    approximatif. L'empattement large est ce qui reste lisible.
  -->
  <rect width="64" height="64" rx="13" fill="#0e7a5f"/>
  <g fill="#ffffff">
    <!-- les deux fûts -->
    <rect x="17" y="14" width="9" height="36"/>
    <rect x="38" y="14" width="9" height="36"/>
    <!-- la traverse -->
    <rect x="17" y="27" width="30" height="9"/>
    <!-- les empattements, haut puis bas -->
    <rect x="12.5" y="14" width="18" height="5"/>
    <rect x="33.5" y="14" width="18" height="5"/>
    <rect x="12.5" y="45" width="18" height="5"/>
    <rect x="33.5" y="45" width="18" height="5"/>
  </g>
</svg>
