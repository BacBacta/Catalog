# fly.toml app configuration file generated for catalog-axor-q on 2026-07-31T22:18:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'catalog-axor-q'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = "sh -c 'cd /app/packages/db && ./node_modules/.bin/prisma migrate deploy && node scripts/apply-constraints.mjs'"

[env]
  COHORTE_POURCENT = '0'
  HSTS = 'true'
  INTERRUPTEUR = 'ouvert'
  INTERRUPTEUR_FICHIER = '/run/catalog/interrupteur'
  NODE_ENV = 'production'
  PORT = '8080'
  SMS_PROVIDER = 'provider'
  TZ = 'Africa/Douala'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
