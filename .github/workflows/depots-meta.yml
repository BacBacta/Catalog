name: Depots Meta

# Execute les scripts de depot (gabarits, Flows) DANS la machine Fly, la ou
# vivent `WABOT_API_KEY` et ses voisines. Ce workflow existe pour une raison
# precise : les depots exigent les secrets de production, et les secrets ne
# sortent pas de leurs coffres — ni dans un poste de travail improvise, ni
# dans une conversation. La CI detient deja `FLY_API_TOKEN` pour deployer ;
# le meme jeton ouvre une console SSH ephemere, et rien d'autre ne circule.
#
# `--deposer` est un acte SORTANT et durable (Meta examine, et une serie de
# refus abime la note de qualite du numero) : les scripts eux-memes refusent
# de partir sans ce mot, et ce workflow ne se declenche qu'a la main.

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Quel script executer"
        required: true
        type: choice
        options: [flux, gabarits, les-deux, mesurer-photopicker, accueil-etat, accueil-poser, mesurer-cta, catalogue-etat, catalogue-deposer, catalogue-synchroniser]
      mode:
        description: "Mode (--etat est en lecture seule)"
        required: true
        type: choice
        options: ["--etat", "--deposer"]
        default: "--etat"
      # Exige par `mesurer-cta` SEUL. Il n'a pas de defaut : une mesure qui
      # part vers un numero devine serait un vrai message chez un inconnu.
      numero:
        description: "mesurer-cta seulement : le numero destinataire, en E.164 (+237…)"
        required: false
        type: string

# Jamais deux depots en meme temps, et on n'annule pas un depot en cours :
# un Flow cree mais non publie s'envoie sans erreur et ne s'ouvre jamais.
concurrency:
  group: depots-meta
  cancel-in-progress: false

jobs:
  depot:
    runs-on: ubuntu-latest
    # `FLY_API_TOKEN` n'est PAS un secret du depot : il vit dans l'environnement
    # GitHub `preproduction`, comme dans deploiement.yml. Sans cette ligne, le
    # secret se resout en chaine vide et flyctl repond « no access token » —
    # mesure au premier run (31640602429, 13 secondes).
    environment: preproduction
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # `-C` execute la commande dans la machine deja en marche
      # (`min_machines_running = 1` dans fly.toml) : pas de checkout ici,
      # les scripts vivent dans l'image, sous /app, avec l'environnement
      # reel du bot. Les modes sont un `choice` ferme : rien d'arbitraire
      # ne peut etre injecte dans la console.
      - name: Flows (flux.mjs)
        if: inputs.quoi == 'flux' || inputs.quoi == 'les-deux'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/flux.mjs ${{ inputs.mode }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Gabarits (gabarits.mjs)
        if: inputs.quoi == 'gabarits' || inputs.quoi == 'les-deux'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/gabarits.mjs ${{ inputs.mode }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # La mesure du composant photo (methode du 11/08 : formulaire JETABLE,
      # temoin, verdict lu dans validation_errors, brouillon supprime). Elle
      # ignore `mode` : rien n'est publie, rien ne survit.
      - name: Mesure PhotoPicker (formulaire jetable)
        if: inputs.quoi == 'mesurer-photopicker'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/flux.mjs --mesurer-photopicker"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Les amorces du fil (« ice breakers ») — ADR 0087. Elles s'affichent au
      # PREMIER ouvrage de la conversation, avant tout message : c'est la
      # reponse a « le bot doit interagir meme sans que l'utilisateur ecrive ».
      - name: Accueil du fil — etat (lecture seule)
        if: inputs.quoi == 'accueil-etat'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/composants.mjs --accueil-etat"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Accueil du fil — poser les amorces
        if: inputs.quoi == 'accueil-poser'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/composants.mjs --accueil-poser"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # `cta_url` est annonce dans les guides de Meta et ABSENT de la reference
      # des messages. La mesure ENVOIE un vrai message au numero donne : c'est
      # le seul moyen de savoir, et c'est pourquoi le numero est exige.
      - name: Mesurer cta_url (envoi reel)
        if: inputs.quoi == 'mesurer-cta'
        # NUMERO passe par l'environnement et non par interpolation : c'est le
        # seul champ libre de ce workflow, et il finit dans une ligne de
        # commande distante. Le filtre ne garde que `+` et des chiffres, donc
        # rien d'autre ne peut atteindre la console.
        run: |
          if [ -z "$NUMERO" ]; then
            echo "Le champ « numero » est exige pour cette mesure — elle envoie un vrai message."
            exit 1
          fi
          if printf '%s' "$NUMERO" | grep -qv '^+[0-9]\{8,15\}$'; then
            echo "Le numero doit etre en E.164 : « + » puis 8 a 15 chiffres."
            exit 1
          fi
          flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/composants.mjs --mesurer-cta $NUMERO"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NUMERO: ${{ inputs.numero }}
      # Le catalogue Commerce Manager — ADR 0108. `catalogue-etat` mesure les
      # trois inconnues de l'ADR (portees du jeton, entreprise, catalogues et
      # liaison) sans rien ecrire. `catalogue-deposer` cree et relie —
      # idempotent, rien n'est jamais supprime. `catalogue-synchroniser`
      # pousse toutes les fiches depuis la base et imprime le verdict de Meta
      # fiche par fiche.
      - name: Catalogue — etat (lecture seule)
        if: inputs.quoi == 'catalogue-etat'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/catalogue.mjs --etat"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Catalogue — deposer (creer et relier)
        if: inputs.quoi == 'catalogue-deposer'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/catalogue.mjs --deposer"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Catalogue — synchroniser les fiches
        if: inputs.quoi == 'catalogue-synchroniser'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/catalogue.mjs --synchroniser"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
