name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Le fuseau du Cameroun, UTC+1 sans heure d'ete (AGENTS.md). Sans ce reglage,
  # les dates lues dans les SMS derivent d'une heure et la fenetre de 48 h du
  # controle d'horodatage passe en local pour echouer en CI.
  TZ: "Africa/Douala"

jobs:
  quality:
    runs-on: ubuntu-latest
    # PostgreSQL 18, la version de la stack. Les invariants d'argent et de
    # preuve vivent en base : sans base reelle, `pnpm test` ne les verifie pas.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql://catalog:catalog@127.0.0.1:5432/catalog?schema=public"
    steps:
      - uses: actions/checkout@v7
      # PAS de `version:` ici. `pnpm/action-setup` REFUSE que la version soit
      # declaree a deux endroits, et `packageManager` de `package.json` en est
      # deja la source de verite — c'est aussi elle que `corepack` lit en local.
      # Poser les deux fait echouer l'action avant meme l'installation.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema de base valide
        run: pnpm db:validate && pnpm --filter @catalog/db check:offline
      - name: Client Prisma
        run: pnpm db:generate
      # Migration + contraintes SQL, puis seed. Le seed n'est pas decoratif :
      # il prouve que le schema accepte les douze cas metier du lot 3, dont les
      # trois modes de paiement et les cinq etats de preuve.
      - name: Migration, contraintes et seed
        run: pnpm db:migrate && pnpm db:seed
      # Instantane du catalogue public. La boutique est un site statique : elle
      # ne parle pas a la base, elle lit cette photo prise a la construction.
      # Sans elle, `pnpm size` mesurerait un site d'une seule page et le budget
      # ne prouverait rien.
      - name: Instantane du catalogue
        run: pnpm shop:snapshot
      - name: Types
        run: pnpm typecheck
      - name: Lint et format
        run: pnpm lint
      # ── Les deux etapes qui suivent partagent UNE base ────────────────
      #
      # C'est un choix : monter un second conteneur postgres couterait plus que
      # ce qu'il rapporterait. Mais il a une consequence, et elle a empoisonne
      # la CI pendant deux jours — les identifiants de test se recouvraient
      # d'une exécution a l'autre, sur des contraintes UNIQUE que la base ne
      # purge jamais (le controle n° 5 est RESEAU-LARGE, par construction).
      #
      # Le bloc par fichier separait les fichiers ; rien ne separait les
      # executions, sinon un sel tire de l'horloge — donc la chance, une fois
      # sur mille. Ces deux valeurs le POSENT.
      #
      # **Elles derivent du PASSAGE, elles ne sont pas constantes**, et ce n'est
      # pas de la coquetterie : `1` et `2` en dur separeraient bien les deux
      # etapes, mais le passage suivant reposerait `1` et recouvrirait le
      # precedent EN ENTIER si la base lui survivait. Mesure du 12/08 : quatorze
      # fichiers rouges d'un coup. Le conteneur postgres est neuf a chaque job,
      # donc le cas ne se presente pas ICI — mais faire dependre la justesse du
      # schema d'un detail d'infrastructure, c'est le perdre le jour ou ce detail
      # change. Le suffixe separe les deux etapes, `run_id` separe les passages.
      #
      # La valeur est longue : `selExecution()` la ramene modulo mille.
      - name: Tests unitaires
        run: pnpm test
        env:
          CATALOG_SEL_EXECUTION: "${{ github.run_id }}0"
      # Couverture du DOMAINE, pas du paquet : `src/adapters` parle a la base et
      # au reseau, et un seuil global pousserait a simuler ces frontieres pour
      # faire monter un chiffre. Le domaine est pur — s'il n'est pas couvert,
      # c'est qu'une regle metier n'est pas verifiee. Seuil dur a 90 %.
      - name: Couverture de src/domain
        run: pnpm test:coverage
        env:
          CATALOG_SEL_EXECUTION: "${{ github.run_id }}1"
      - name: Build
        run: pnpm build
      - name: Budget de poids — la boutique doit rester sous 30 Ko de JS
        run: pnpm size
      # ── Audit de dependances (lot 15) ────────────────────────────────────
      #
      # `--prod` et non l'audit complet, et c'est le point entier de cette
      # etape. Un avis sur `@lhci/cli` ou sur `vite-plugin-pwa` decrit du code
      # qui tourne sur cette machine-ci pendant deux minutes ; un avis sur Hono,
      # Prisma ou Better Auth decrit du code qui tourne devant des paiements.
      # Les mettre dans le meme rapport, c'est apprendre a l'equipe a passer
      # au-dessus des deux.
      #
      # L'audit complet reste vide aujourd'hui — voir les resolutions de
      # `pnpm-workspace.yaml` —, mais il depend d'avis publies sur de
      # l'outillage tiers : le faire bloquer rendrait la CI rouge un matin, pour
      # une raison qui n'a rien a voir avec ce que le depot deploie.
      - name: Audit des dependances de production
        run: pnpm audit --prod --audit-level high
      # ── La politique de securite de la boutique decrit-elle le HTML emis ? ──
      #
      # `vercel.json` et `_headers` portent les empreintes de la politique de
      # securite de contenu et les reecritures `/v/*` et `/suivi/*` — que Vercel
      # ne lit ni dans `_redirects` ni dans `_headers`, qui sont des formats
      # Netlify et Cloudflare. Faux, ils ne provoquent AUCUNE erreur de
      # construction : ils cassent la page dans le navigateur d'une acheteuse,
      # en production seulement.
      #
      # Ce sont des ARTEFACTS de construction, produits dans `dist/` et non
      # versionnes : leur contenu depend de `PUBLIC_API_BASE` et des empreintes
      # du HTML, donc de l'instantane du catalogue que la CI regenere depuis une
      # base semee. La premiere version de cette garde les comparait a un fichier
      # commite par `git diff` — elle ne pouvait pas passer, et ne passait pas.
      #
      # Ce qui est verifie ici est plus fort : que les empreintes DECLAREES sont
      # celles des scripts REELLEMENT emis. Ces assertions vivent dans
      # `entetes.test.ts` et se declarent ignorees sans `dist/` — d'ou ce second
      # passage des tests de la boutique, APRES le build. Sans lui, elles ne
      # tournaient jamais en integration continue.
      - name: En-tetes et CSP — verifies contre le HTML construit
        run: pnpm --filter @catalog/shop test

  e2e:
    runs-on: ubuntu-latest
    # PAS de `needs: quality`, et c'est un choix mesure : les deux jobs sont
    # independants — chacun monte sa base, son build, son instantane. En serie,
    # le mur valait quality + e2e (~12-13 min) ; en parallele, il vaut e2e seul
    # (~8-9 min). Le prix : quand `quality` echoue, les minutes d'e2e sont
    # depensees pour rien — des minutes de machine contre du temps d'attente
    # humain, a chaque PR. Mesure du 12/08 : cinq PR Dependabot fusionnees en
    # serie, chaque cycle payait la somme.
    #
    # Le parcours vendeuse du lot 4 s'execute contre un VRAI serveur : session,
    # OTP, journal d'audit. Une API simulee ne prouverait rien de ce que ce lot
    # doit tenir, donc ce job a besoin de la base — sans elle, le parcours se
    # declare ignore et le critere de la definition de terminé n'est pas verifie.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql://catalog:catalog@127.0.0.1:5432/catalog?schema=public"
    steps:
      - uses: actions/checkout@v7
      # PAS de `version:` ici. `pnpm/action-setup` REFUSE que la version soit
      # declaree a deux endroits, et `packageManager` de `package.json` en est
      # deja la source de verite — c'est aussi elle que `corepack` lit en local.
      # Poser les deux fait echouer l'action avant meme l'installation.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client Prisma, migration, contraintes et seed
        run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - name: Instantane du catalogue
        run: pnpm shop:snapshot
      # Les tests de bout en bout tournent sur un profil mobile bas de gamme
      # bride (Moto G Power, Slow 4G) et non sur un poste de developpement :
      # c'est la seule facon d'empecher la derive vers une application qui ne
      # marche bien que chez ceux qui l'ecrivent.
      #
      # `--filter @catalog/seller` n'est PAS decoratif. `@playwright/test` est
      # une dependance de `apps/seller`, pas de la racine : pnpm n'installe pas
      # a plat, donc la racine n'a que ses propres binaires et `pnpm exec
      # playwright` y echoue sur « Command not found ». En local la commande
      # semble marcher — elle attrape un playwright global du PATH, souvent
      # d'une AUTRE version, qui installerait le mauvais navigateur. Le filtre
      # garantit la version du depot, la seule que `pnpm e2e` utilisera.
      #
      # Le cache evite de re-telecharger Chromium (~130 Mo) a chaque passage.
      # La cle est le hachage du lockfile : plus large que necessaire — un bump
      # sans rapport invalide le cache —, mais un rate ne coute que le
      # telechargement qu'on payait deja a chaque fois. `playwright install`
      # reste indispensable apres un cache tombe juste : il verifie le
      # navigateur et pose les dependances systeme (`--with-deps`).
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @catalog/seller exec playwright install --with-deps chromium
      # Le serveur de previsualisation sert le build : il faut donc construire.
      - run: pnpm --filter @catalog/seller build
      - name: Construction de la boutique publique
        run: pnpm --filter @catalog/shop build
      # Le budget est deja verifie dans `quality` ; ici il garde la sortie que
      # Lighthouse va mesurer, pour qu'un ecart entre les deux se voie.
      - name: Budget de poids de la boutique
        run: pnpm size
      # Seuils DURS sur profil mobile bride : performance >= 95, accessibilite =
      # 100, LCP < 2,5 s, decalage visuel < 0,1. Mesurer sur un poste de
      # developpement donnerait 100 partout et ne prouverait rien.
      - name: Lighthouse — boutique publique
        env:
          LHCI_URLS: >-
            http://localhost/index.html,http://localhost/chez-maman-jeanne/index.html,http://localhost/chez-maman-jeanne/robe-wax-grande-taille-000000/index.html
        run: pnpm shop:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-lighthouse
          path: apps/shop/.lighthouseci/*.html
          if-no-files-found: ignore
          retention-days: 7
      # Bloquant depuis le lot 2. AGENTS.md exige zero violation axe-core
      # bloquante, et la page de demonstration du design system en est la
      # premiere cible reelle. Ce job verifie aussi les cibles tactiles de
      # 44px sur la geometrie RENDUE, ce qu'aucun test unitaire ne peut faire.
      #
      # Depuis le lot 4, il parcourt aussi toute l'authentification vendeuse et
      # prouve que le COLLAGE fonctionne dans le champ OTP — critere WCAG 2.2
      # §3.3.8, invisible a tout autre niveau de test.
      - run: pnpm --filter @catalog/seller e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-design-system
          path: apps/seller/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
