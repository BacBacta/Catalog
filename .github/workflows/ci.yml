name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Le fuseau du Cameroun, UTC+1 sans heure d'ete (AGENTS.md). Sans ce reglage,
  # les dates lues dans les SMS derivent d'une heure et la fenetre de 48 h du
  # controle d'horodatage passe en local pour echouer en CI.
  TZ: "Africa/Douala"

jobs:
  quality:
    runs-on: ubuntu-latest
    # PostgreSQL 18, la version de la stack. Les invariants d'argent et de
    # preuve vivent en base : sans base reelle, `pnpm test` ne les verifie pas.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql://catalog:catalog@127.0.0.1:5432/catalog?schema=public"
    steps:
      - uses: actions/checkout@v5
      # PAS de `version:` ici. `pnpm/action-setup` REFUSE que la version soit
      # declaree a deux endroits, et `packageManager` de `package.json` en est
      # deja la source de verite — c'est aussi elle que `corepack` lit en local.
      # Poser les deux fait echouer l'action avant meme l'installation.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema de base valide
        run: pnpm db:validate && pnpm --filter @catalog/db check:offline
      - name: Client Prisma
        run: pnpm db:generate
      # Migration + contraintes SQL, puis seed. Le seed n'est pas decoratif :
      # il prouve que le schema accepte les douze cas metier du lot 3, dont les
      # trois modes de paiement et les cinq etats de preuve.
      - name: Migration, contraintes et seed
        run: pnpm db:migrate && pnpm db:seed
      # Instantane du catalogue public. La boutique est un site statique : elle
      # ne parle pas a la base, elle lit cette photo prise a la construction.
      # Sans elle, `pnpm size` mesurerait un site d'une seule page et le budget
      # ne prouverait rien.
      - name: Instantane du catalogue
        run: pnpm shop:snapshot
      - name: Types
        run: pnpm typecheck
      - name: Lint et format
        run: pnpm lint
      - name: Tests unitaires
        run: pnpm test
      # Couverture du DOMAINE, pas du paquet : `src/adapters` parle a la base et
      # au reseau, et un seuil global pousserait a simuler ces frontieres pour
      # faire monter un chiffre. Le domaine est pur — s'il n'est pas couvert,
      # c'est qu'une regle metier n'est pas verifiee. Seuil dur a 90 %.
      - name: Couverture de src/domain
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Budget de poids — la boutique doit rester sous 30 Ko de JS
        run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    # Le parcours vendeuse du lot 4 s'execute contre un VRAI serveur : session,
    # OTP, journal d'audit. Une API simulee ne prouverait rien de ce que ce lot
    # doit tenir, donc ce job a besoin de la base — sans elle, le parcours se
    # declare ignore et le critere de la definition de terminé n'est pas verifie.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql://catalog:catalog@127.0.0.1:5432/catalog?schema=public"
    steps:
      - uses: actions/checkout@v5
      # PAS de `version:` ici. `pnpm/action-setup` REFUSE que la version soit
      # declaree a deux endroits, et `packageManager` de `package.json` en est
      # deja la source de verite — c'est aussi elle que `corepack` lit en local.
      # Poser les deux fait echouer l'action avant meme l'installation.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client Prisma, migration, contraintes et seed
        run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - name: Instantane du catalogue
        run: pnpm shop:snapshot
      # Les tests de bout en bout tournent sur un profil mobile bas de gamme
      # bride (Moto G Power, Slow 4G) et non sur un poste de developpement :
      # c'est la seule facon d'empecher la derive vers une application qui ne
      # marche bien que chez ceux qui l'ecrivent.
      - run: pnpm exec playwright install --with-deps chromium
      # Le serveur de previsualisation sert le build : il faut donc construire.
      - run: pnpm --filter @catalog/seller build
      - name: Construction de la boutique publique
        run: pnpm --filter @catalog/shop build
      # Le budget est deja verifie dans `quality` ; ici il garde la sortie que
      # Lighthouse va mesurer, pour qu'un ecart entre les deux se voie.
      - name: Budget de poids de la boutique
        run: pnpm size
      # Seuils DURS sur profil mobile bride : performance >= 95, accessibilite =
      # 100, LCP < 2,5 s, decalage visuel < 0,1. Mesurer sur un poste de
      # developpement donnerait 100 partout et ne prouverait rien.
      - name: Lighthouse — boutique publique
        env:
          LHCI_URLS: >-
            http://localhost/index.html,http://localhost/chez-maman-jeanne/index.html,http://localhost/chez-maman-jeanne/robe-wax-grande-taille-000000/index.html
        run: pnpm shop:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-lighthouse
          path: apps/shop/.lighthouseci/*.html
          if-no-files-found: ignore
          retention-days: 7
      # Bloquant depuis le lot 2. AGENTS.md exige zero violation axe-core
      # bloquante, et la page de demonstration du design system en est la
      # premiere cible reelle. Ce job verifie aussi les cibles tactiles de
      # 44px sur la geometrie RENDUE, ce qu'aucun test unitaire ne peut faire.
      #
      # Depuis le lot 4, il parcourt aussi toute l'authentification vendeuse et
      # prouve que le COLLAGE fonctionne dans le champ OTP — critere WCAG 2.2
      # §3.3.8, invisible a tout autre niveau de test.
      - run: pnpm --filter @catalog/seller e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-design-system
          path: apps/seller/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
