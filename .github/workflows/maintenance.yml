name: Maintenance

# ── Manuel, et uniquement manuel ───────────────────────────────────────────
#
# Rien ici ne part sur un evenement. Ces operations touchent la base de
# preproduction ; elles se declenchent parce que quelqu'un l'a decide, jamais
# parce qu'une branche a bouge.
#
# ── Pourquoi ce workflow existe — ADR 0071 ────────────────────────────────
#
# Depuis l'ADR 0070, `DATABASE_URL` ne vit plus qu'a UN endroit : les secrets
# de l'application Fly. C'est un progres, et il a un corollaire : plus personne
# ne peut regarder ni corriger la base depuis un poste. La seule facon d'agir
# est de le faire DEPUIS la machine, ou le secret est chez lui — et le seul
# canal qui y mene sans distribuer de nouveau secret est celui-ci, avec le
# `FLY_API_TOKEN` que le deploiement utilise deja.
#
# La contrepartie est bonne : chaque intervention laisse une execution datee,
# nominative et relisible, au lieu d'un terminal dont il ne reste rien.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Ce qu'on fait"
        type: choice
        options: [inventaire, etat-flux, poser-flux-inscription, remise-a-zero]
        default: inventaire
      confirmation:
        description: "Pour « remise-a-zero » UNIQUEMENT : taper REMISE-A-ZERO-PREPRODUCTION"
        type: string
        default: ""
      waba:
        description: "Pour les operations de flux : WHATSAPP_WABA_ID, si la resolution automatique ne suffit pas. Pas un secret."
        type: string
        default: ""

concurrency:
  group: maintenance-preproduction
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ── Les scripts viennent de l'IMAGE, pas de ce checkout ─────────────
      #
      # `flyctl ssh console` execute le code de l'image DEPLOYEE. Le checkout
      # ci-dessus ne sert qu'au contexte du workflow : un script fraichement
      # fusionne dans `main` n'existe pas dans la machine tant que l'API n'a
      # pas ete redeployee.
      #
      # Constate le 11/08/2026, premiere execution de ce workflow :
      # « Cannot find module /app/packages/db/scripts/inventaire.mjs ». Le
      # message ne dit pas que l'image est en retard — il se lit comme un
      # chemin faux. On refuse donc de partir, en le disant.
      - name: L'image deployee connait ces scripts
        run: |
          set -euo pipefail
          if ! flyctl ssh console --app catalog-api-preprod \
                 -C "test -f /app/packages/db/scripts/inventaire.mjs"; then
            echo "L'API deployee ne contient pas les scripts de maintenance."
            echo
            echo "Ils vivent dans l'IMAGE, pas dans ce checkout : lancer d'abord"
            echo "« Deploiement » avec cible=api pour embarquer le commit courant."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Lecture seule : rien n'est ecrit, rien n'est confirme ───────────
      - name: Inventaire
        if: inputs.operation == 'inventaire'
        run: flyctl ssh console --app catalog-api-preprod -C "node /app/packages/db/scripts/inventaire.mjs"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Les identifiants des formulaires, demandes a Meta ──────────────
      #
      # `flux.mjs --etat` liste les Flows du compte et affiche, pour chacun,
      # son statut et la ligne `WABOT_FLUX_..._ID=<id>` prete a coller. Il
      # tourne DANS la machine, seule a detenir `WABOT_API_KEY`.
      #
      # Ce qui sort n'est PAS un secret : des identifiants de formulaire et
      # des statuts. La cle, elle, ne quitte pas la machine.
      #
      # Un Flow en BROUILLON s'envoie sans erreur et ne s'ouvre jamais — c'est
      # l'oubli le plus couteux du dispositif, et c'est pour cela que le statut
      # est affiche a cote de l'identifiant.
      - name: Etat des formulaires
        if: inputs.operation == 'etat-flux'
        run: |
          flyctl ssh console --app catalog-api-preprod \
            -C "sh -c 'WHATSAPP_WABA_ID=${{ inputs.waba }} node /app/apps/api/scripts/flux.mjs --etat'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Poser l'identifiant du formulaire d'inscription — tache #60 ─────
      #
      # La machine sait DEMANDER l'identifiant a Meta (elle seule detient
      # `WABOT_API_KEY`), mais ne sait pas ecrire ses propres secrets ; le
      # runner detient `FLY_API_TOKEN` mais pas la cle Meta. Ce pas fait le
      # pont : il lit l'etat DEPUIS la machine, et pose le secret DEPUIS le
      # runner. Aucun identifiant ne transite par un humain.
      #
      # **Seul un Flow PUBLISHED se pose.** Un brouillon s'envoie sans erreur
      # et ne s'ouvre jamais — poser son identifiant serait installer la panne
      # la plus silencieuse du dispositif. On refuse, en le disant.
      #
      # `flyctl secrets set` REDEMARRE l'application : le pas est a lancer
      # apres un deploiement, pas pendant.
      - name: Poser l'identifiant du formulaire d'inscription
        if: inputs.operation == 'poser-flux-inscription'
        run: |
          set -euo pipefail
          # `inputs.waba` vide : la chaine `WHATSAPP_WABA_ID=` pose une variable
          # VIDE, que le script traite comme absente (`?.trim()` puis test de
          # verite) — la resolution automatique reprend la main.
          sortie=$(flyctl ssh console --app catalog-api-preprod \
            -C "sh -c 'WHATSAPP_WABA_ID=${{ inputs.waba }} node /app/apps/api/scripts/flux.mjs --etat'" | tr -d '\r')
          echo "$sortie"
          ligne=$(echo "$sortie" | awk '
            /catalog_inscription : PUBLISHED/ { ok = 1; next }
            /WABOT_FLUX_INSCRIPTION_ID=/ { if (ok) { gsub(/^[ \t]+/, ""); print; exit } ok = 0 }
          ')
          if [ -z "$ligne" ]; then
            echo ""
            echo "catalog_inscription n'est pas PUBLISHED (ou absent) : rien n'est pose."
            echo "Publier le Flow d'abord — un brouillon s'envoie sans erreur et ne s'ouvre jamais."
            exit 1
          fi
          echo ""
          echo "Pose : $ligne"
          flyctl secrets set "$ligne" --app catalog-api-preprod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── La phrase se tape, elle ne se coche pas ─────────────────────────
      #
      # Un menu deroulant a deux entrees se choisit de travers ; une phrase de
      # vingt-six caracteres ne s'ecrit pas par accident. C'est le meme verrou
      # que le script porte lui-meme, et il est ici EN PLUS, pas a la place :
      # celui du script protege aussi les invocations qui ne passent pas par ce
      # workflow.
      - name: La confirmation est exacte
        if: inputs.operation == 'remise-a-zero'
        run: |
          test "${{ inputs.confirmation }}" = "REMISE-A-ZERO-PREPRODUCTION" || {
            echo "Confirmation absente ou inexacte : rien n'a ete touche."
            echo "Taper exactement REMISE-A-ZERO-PREPRODUCTION dans le champ prevu."
            exit 1
          }

      - name: Remise a zero de la preproduction
        if: inputs.operation == 'remise-a-zero'
        run: |
          flyctl ssh console --app catalog-api-preprod \
            -C "sh -c 'CONFIRMATION=REMISE-A-ZERO-PREPRODUCTION sh /app/packages/db/scripts/remise-a-zero.sh'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── La boutique publiee est PERIMEE des cet instant ─────────────────
      #
      # Elle est statique : ses pages continuent d'etre servies par le CDN avec
      # les boutiques d'avant. Le dire ici evite de le decouvrir en constatant
      # qu'une page effacee repond encore.
      - name: Et maintenant
        if: inputs.operation == 'remise-a-zero'
        run: |
          echo "La base est neuve. La boutique publiee, elle, sert encore l'ancien"
          echo "instantane — elle est statique, c'est normal."
          echo
          echo "Lancer « Deploiement » avec cible=boutique pour la reconstruire."
