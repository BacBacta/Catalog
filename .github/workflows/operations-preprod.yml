name: Operations preproduction

# Les operations d'entretien de la preproduction, executees la ou vivent les
# secrets — la machine Fly ou l'API Fly — avec le FLY_API_TOKEN que la CI
# detient deja pour deployer. Meme logique que depots-meta.yml : rien ne
# transite par un poste ou une conversation, tout est manuel et audite.

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Quelle operation"
        required: true
        type: choice
        options:
          [
            reinitialiser-boutiques-bot,
            poser-flux-ids,
            poser-banc-essai,
            sonde-connexion,
            rejouer-accroche,
          ]
      mode:
        description: "Reinitialisation seulement : --voir (lecture seule) ou --vraiment"
        required: true
        type: choice
        options: ["--voir", "--vraiment"]
        default: "--voir"
      numero:
        description: "rejouer-accroche seulement : le wa_id destinataire, sans « + » (ex. 32466457281)"
        required: false
        type: string
        default: ""

concurrency:
  group: operations-preprod
  cancel-in-progress: false

jobs:
  operation:
    runs-on: ubuntu-latest
    # FLY_API_TOKEN vit dans l'environnement GitHub `preproduction`, pas au
    # niveau du depot — meme lecon que depots-meta.yml (run 31640602429).
    environment: preproduction
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Le script vit dans l'IMAGE : il supprime les vendeuses
      # `canal_ouverture = 'bot'` et tout ce qui s'y rattache, leve les
      # verrous d'ajout seul DANS sa transaction, et demande la
      # reconstruction de la boutique publique. `--voir` liste sans toucher ;
      # `--vraiment` ne part que choisi a la main ici.
      - name: Reinitialiser les boutiques nees du bot
        if: inputs.quoi == 'reinitialiser-boutiques-bot'
        run: flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/reinitialiser-boutiques-bot.mjs ${{ inputs.mode }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Les identifiants des quatre Flows publies (depots du 12/08). Ce ne
      # sont pas des secrets — des identifiants de configuration, deja
      # imprimes par flux.mjs — mais ils vivent dans l'environnement de la
      # machine, et `secrets set` redemarre les machines avec la nouvelle
      # valeur. Relancer cette operation est idempotent.
      - name: Poser les identifiants de Flows
        if: inputs.quoi == 'poser-flux-ids'
        run: >-
          flyctl secrets set
          WABOT_FLUX_LIVRAISON_ID=4521530501458065
          WABOT_FLUX_INSCRIPTION_ID=2262764424546659
          WABOT_FLUX_OUVERTURE_ID=1032068266296594
          WABOT_FLUX_ARTICLE_ID=27695141573488361
          WABOT_FLUX_AVIS_ID=1377188850409808
          --app catalog-api-preprod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Le banc d'essai HORS Cameroun (ADR 0058) : les numeros nommes ici
      # peuvent ouvrir une session malgre la regle « hors Cameroun, pas de
      # compte ». Mesure du 13/08 : la connexion WhatsApp du porteur du
      # produit (+32…) etait ignoree en silence — la regle faisait son
      # travail, la liste etait simplement vide. Ce numero est celui du banc
      # de test du porteur, deja public dans le fil de preproduction ; il se
      # retire en re-executant l'operation avec une liste vide le jour ou le
      # test bascule sur des numeros camerounais.
      - name: Poser les numeros du banc d'essai
        if: inputs.quoi == 'poser-banc-essai'
        run: flyctl secrets set BANC_ESSAI_NUMEROS_HORS_CM="+32466457281" --app catalog-api-preprod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # ── Voir la copie sur un vrai telephone, sans attendre un pouce ────────
      #
      # AGENTS.md §7.5 : la definition de terminé est une commande, et pour une
      # copie c'est une capture d'ecran. Un instantane de test dit que le
      # message a la bonne FORME ; il ne dit pas ce qu'un pouce en voit — le
      # pli de « Voir plus », la hauteur du menu, deux libelles identiques dans
      # un meme ecran. C'est ce qui a produit l'ADR 0109, et rien dans la suite
      # de tests ne l'aurait montre.
      #
      # L'operation rejoue donc un ENTRANT — « bonjour » — au nom du numero
      # donne : le bot repond pour de vrai, sur le telephone, par le chemin
      # normal. On simule le pouce, on observe l'ecran (`sandbox-entrant.mjs`).
      #
      # ── Ce qu'elle ne fait PAS, et c'est deliberé ─────────────────────────
      #
      # Elle n'INITIE pas une conversation : elle fait ARRIVER un message
      # entrant, exactement comme le telephone l'aurait envoye, et le bot
      # repond dans la fenetre que cet entrant ouvre. L'invariant de l'ADR 0034
      # — le bot ne parle jamais le premier — tient au sens strict.
      #
      # Les deux valeurs sensibles restent SUR la machine : le shell distant
      # les lit dans son environnement, la ligne de commande ne porte que leurs
      # noms, et le script n'imprime que le code de retour et le destinataire.
      - name: Rejouer l'accroche vers un numero
        if: inputs.quoi == 'rejouer-accroche'
        run: |
          set -euo pipefail
          numero='${{ inputs.numero }}'
          case "$numero" in
            '') echo "Donnez le wa_id destinataire dans « numero », sans « + »."; exit 1 ;;
            *[!0-9]*) echo "Le wa_id ne porte que des chiffres — recu : $numero"; exit 1 ;;
          esac
          flyctl ssh console --app catalog-api-preprod -C "sh -lc 'ENTRANT_URL=http://127.0.0.1:8080/api/whatsapp/entrant/\$WHATSAPP_ENTRANT_SECRET ENTRANT_AUTH=\$WABOT_WEBHOOK_AUTH node apps/api/scripts/sandbox-entrant.mjs $numero texte bonjour'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Lecture seule : ou en est la chaine de connexion WhatsApp — defis
      # crees, consommes, verifies. Aucun secret n'est imprime (identifiants
      # masques, statuts seuls).
      - name: Sonde de la connexion WhatsApp
        if: inputs.quoi == 'sonde-connexion'
        # Deux lectures : l'etat des defis en base, puis les SEULS
        # avertissements du webhook dans les journaux recents — la route
        # avale les erreurs de traitement avec un `console.warn` resume
        # (`resumerErreur`, sans contenu) : c'est la qu'une panne silencieuse
        # dit son nom.
        run: |
          flyctl ssh console --app catalog-api-preprod -C "node apps/api/scripts/diagnostic-connexion.mjs"
          echo "── avertissements recents du webhook ──"
          flyctl logs --no-tail --app catalog-api-preprod 2>/dev/null \
            | grep -E "non traite|livraison entrante refusee" | tail -8 \
            || echo "(aucun avertissement dans la fenetre de journaux)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
