packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # NON. `protobufjs` arrive en dependance TRANSITIVE d'OpenTelemetry (lot 14) et
  # son script d'installation ne sert qu'au transport protobuf. Les exportateurs
  # que nous utilisons sont les `*-otlp-http`, qui parlent JSON : ce script ne
  # produit rien dont ce depot se serve. Un script d'installation arbitraire, dans
  # un depot qui touche a des paiements, ne s'execute pas « au cas ou ».
  protobufjs: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdown-satteri@0.3.5'
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - '@size-limit/file@13.0.2'
  - astro@7.1.5
  - size-limit@13.0.2
  - '@aws-sdk/checksums@3.1000.23'
  - '@aws-sdk/client-s3@3.1098.0'
  - '@aws-sdk/core@3.977.3'
  - '@aws-sdk/credential-provider-env@3.972.64'
  - '@aws-sdk/credential-provider-http@3.972.66'
  - '@aws-sdk/credential-provider-ini@3.973.9'
  - '@aws-sdk/credential-provider-login@3.972.71'
  - '@aws-sdk/credential-provider-node@3.972.75'
  - '@aws-sdk/credential-provider-process@3.972.64'
  - '@aws-sdk/credential-provider-sso@3.973.8'
  - '@aws-sdk/credential-provider-web-identity@3.972.70'
  - '@aws-sdk/middleware-sdk-s3@3.972.69'
  - '@aws-sdk/nested-clients@3.997.38'
  - '@aws-sdk/s3-request-presigner@3.1098.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.43'
  - '@aws-sdk/token-providers@3.1098.0'
  - '@smithy/core@3.31.1'
  - '@smithy/credential-provider-imds@4.4.16'
  - '@smithy/fetch-http-handler@5.6.13'
  - '@smithy/node-http-handler@4.9.13'
  - '@smithy/signature-v4@5.6.12'

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# `tslib` 1.x n'a pas `__spreadArray`, que Lighthouse appelle : sans cette
# resolution, tous les audits de performance sortent en erreur
# « tslib_1.__spreadArray is not a function » et le score de la categorie devient
# nul. C'est une collision de dependance transitive, pas un choix de stack.
overrides:
  tslib: ^2.8.1

  # ── Audit de dependances (lot 15) ────────────────────────────────────────
  #
  # `pnpm audit` signalait quatre avis, dont deux ELEVES. Tous portaient sur de
  # l'outillage de construction — `@lhci/cli` et `vite-plugin-pwa` —, donc rien
  # de ce qui part en production : `pnpm audit --prod` etait deja vide, et c'est
  # cette commande-la qui garde la CI.
  #
  # Ces resolutions ont ete posees quand meme, et il faut savoir pourquoi : un
  # rapport d'audit qui affiche en permanence deux lignes rouges « connues et
  # sans gravite » est un rapport qu'on cesse de lire. Le jour ou une CINQUIEME
  # ligne apparait — celle qui compte —, elle se noie dans les quatre autres.
  # Un audit ne vaut que s'il est vide.
  #
  # Les trois montees traversent des frontieres de version majeure (`uuid` 8 → 11
  # passe en modules ES). Elles ont donc ete VERIFIEES et non supposees : build
  # de l'app vendeuse avec `vite-plugin-pwa` (qui atteint `brace-expansion` par
  # workbox), et `pnpm shop:lighthouse` complet — quinze passages, toutes les
  # assertions vertes.
  brace-expansion: ^5.0.8
  tmp: ^0.2.6
  uuid: ^11.1.1

  # ── Deux avis ELEVES apparus le 07/08/2026, sur `--prod` cette fois ───────
  #
  # Ils ont fait echouer la porte du deploiement sur un commit qui ne touche
  # AUCUN fichier de dependance. C'est le propre de `pnpm audit` : il interroge
  # la base d'avis en direct, donc il peut passer au rouge sans qu'une ligne du
  # depot ait bouge. Le rouge etait donc juste, et la porte a bien fait son
  # travail.
  #
  # `fast-uri` < 3.1.5 — confusion d'hote via antislash (GHSA-7p8r-x3mc-p8w7).
  # Il arrive par `ajv`, sous `prisma`, en dix-sept chemins. Une seule version
  # dans l'arbre (3.1.4), donc la resolution est sans risque de collision.
  fast-uri: ^3.1.5

  # `js-yaml` — CPU quadratique sur `!!omap` (CVE-2026-59870), NON retroporte.
  #
  # La resolution est BORNEE A LA LIGNE 4.x, et ce n'est pas une precaution de
  # style : `@lhci/utils` tire `js-yaml` 3.15.0, hors de la plage vulnerable
  # (>=4.0.0 <4.3.1). Un override global l'aurait fait sauter de 3 a 4 — une
  # frontiere majeure ou `safeLoad` disparait —, cassant Lighthouse pour
  # corriger une faille qui ne le concerne pas.
  js-yaml@4: ^4.3.1
