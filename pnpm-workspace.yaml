packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # NON. `protobufjs` arrive en dependance TRANSITIVE d'OpenTelemetry (lot 14) et
  # son script d'installation ne sert qu'au transport protobuf. Les exportateurs
  # que nous utilisons sont les `*-otlp-http`, qui parlent JSON : ce script ne
  # produit rien dont ce depot se serve. Un script d'installation arbitraire, dans
  # un depot qui touche a des paiements, ne s'execute pas « au cas ou ».
  protobufjs: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdown-satteri@0.3.5'
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - '@size-limit/file@13.0.2'
  - astro@7.1.5
  - size-limit@13.0.2
  - '@aws-sdk/checksums@3.1000.23'
  - '@aws-sdk/client-s3@3.1098.0'
  - '@aws-sdk/core@3.977.3'
  - '@aws-sdk/credential-provider-env@3.972.64'
  - '@aws-sdk/credential-provider-http@3.972.66'
  - '@aws-sdk/credential-provider-ini@3.973.9'
  - '@aws-sdk/credential-provider-login@3.972.71'
  - '@aws-sdk/credential-provider-node@3.972.75'
  - '@aws-sdk/credential-provider-process@3.972.64'
  - '@aws-sdk/credential-provider-sso@3.973.8'
  - '@aws-sdk/credential-provider-web-identity@3.972.70'
  - '@aws-sdk/middleware-sdk-s3@3.972.69'
  - '@aws-sdk/nested-clients@3.997.38'
  - '@aws-sdk/s3-request-presigner@3.1098.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.43'
  - '@aws-sdk/token-providers@3.1098.0'
  - '@smithy/core@3.31.1'
  - '@smithy/credential-provider-imds@4.4.16'
  - '@smithy/fetch-http-handler@5.6.13'
  - '@smithy/node-http-handler@4.9.13'
  - '@smithy/signature-v4@5.6.12'

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# `tslib` 1.x n'a pas `__spreadArray`, que Lighthouse appelle : sans cette
# resolution, tous les audits de performance sortent en erreur
# « tslib_1.__spreadArray is not a function » et le score de la categorie devient
# nul. C'est une collision de dependance transitive, pas un choix de stack.
overrides:
  tslib: ^2.8.1

  # ── Audit de dependances (lot 15) ────────────────────────────────────────
  #
  # `pnpm audit` signalait quatre avis, dont deux ELEVES. Tous portaient sur de
  # l'outillage de construction — `@lhci/cli` et `vite-plugin-pwa` —, donc rien
  # de ce qui part en production : `pnpm audit --prod` etait deja vide, et c'est
  # cette commande-la qui garde la CI.
  #
  # Ces resolutions ont ete posees quand meme, et il faut savoir pourquoi : un
  # rapport d'audit qui affiche en permanence deux lignes rouges « connues et
  # sans gravite » est un rapport qu'on cesse de lire. Le jour ou une CINQUIEME
  # ligne apparait — celle qui compte —, elle se noie dans les quatre autres.
  # Un audit ne vaut que s'il est vide.
  #
  # Les trois montees traversent des frontieres de version majeure (`uuid` 8 → 11
  # passe en modules ES). Elles ont donc ete VERIFIEES et non supposees : build
  # de l'app vendeuse avec `vite-plugin-pwa` (qui atteint `brace-expansion` par
  # workbox), et `pnpm shop:lighthouse` complet — quinze passages, toutes les
  # assertions vertes.
  # Plancher releve le 11/08/2026 : un nouvel avis (contournement de la
  # mitigation de CVE-2026-14257) porte le correctif a 5.0.9. Meme paquet, meme
  # raison qu'au-dessus, et toujours de l'outillage de construction — donc hors
  # de ce que `--prod` garde. Le plancher se releve quand meme : une resolution
  # posee pour tenir un audit vide ne vaut que si on l'entretient. Montee de
  # correctif dans le meme majeur, verifiee par le build de l'app vendeuse (qui
  # l'atteint par workbox) et non par un nouveau passage Lighthouse — celui-ci
  # gardait le franchissement d'un MAJEUR, pas un correctif.
  brace-expansion: ^5.0.9
  tmp: ^0.2.6
  uuid: ^11.1.1

  # ── Trois avis ELEVES parus depuis le 02/08/2026 ─────────────────────────
  #
  # Ils ne viennent PAS de cette branche : `pnpm audit --prod` echoue de la
  # meme facon sur `main` (verifie sur un clone propre de 0da8eee, 3 eleves,
  # 3 moyens, 1 faible). La derniere CI verte de `main` date du 02/08 ; les
  # trois avis ont ete publies depuis. Un depot dont la chaine de verification
  # rougit au rythme des publications d'avis n'a pas de defaut de code, il a
  # une dette d'entretien — c'est celle-ci.
  #
  # Les trois sont TRANSITIFS, en une seule version dans l'arbre, et corriges
  # a l'interieur du meme majeur. Aucune frontiere de version majeure n'est
  # traversee ici, contrairement aux trois resolutions du dessus : le risque
  # est d'un autre ordre, et la verification aussi (chaine complete rejouee,
  # budgets compris).
  #
  #   fast-uri  3.1.4 → 3.1.5   confusion d'hote par antislash, via ajv, que
  #                             `@prisma/dev` traine derriere `prisma`
  #   js-yaml   4.3.0 → 4.3.1   consommation quadratique sur `!!omap`
  #                             (CVE-2026-59870), via Astro
  #   nanoid    3.3.16 → 3.3.17 boucle infinie a taille zero, via postcss,
  #                             que vite tire — postcss demande `^3.3.11`,
  #                             la borne haute reste dans le majeur 3
  fast-uri: ^3.1.5
  js-yaml: ^4.3.1
  nanoid: ^3.3.17

  # ── Avis ELEVE du 16/08/2026 (GHSA-ggr8-5vv4-36mx) ───────────────────────
  #
  # `deepmerge-ts` : epuisement de pile sur des graphes d'objets recursifs.
  # Introduit par `@prisma/config`, une dependance de PRODUCTION (Prisma sert
  # les paiements) — contrairement aux avis du dessus, celui-ci sortait de
  # `pnpm audit --prod`, donc de la garde de CI.
  #
  # `deepmerge-ts` n'est appele nulle part dans ce depot : c'est un detail
  # interne a `@prisma/config`, qui ne merge que des objets de configuration
  # (schema.prisma, variables d'environnement) — jamais de donnee utilisateur
  # ni de paiement. La montee 7 → 8 traverse un MAJEUR (renommages de types,
  # `deepmergeInto` qui ne mute plus par alias) ; verifiee par la chaine
  # complete (`db:validate`, `db:generate`, `db:migrate`, `db:seed`, build)
  # plutot que par un appel direct, puisque le depot n'en fait aucun.
  deepmerge-ts: ^8.0.1
