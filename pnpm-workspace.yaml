packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdown-satteri@0.3.5'
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - '@size-limit/file@13.0.2'
  - astro@7.1.5
  - size-limit@13.0.2
  - '@aws-sdk/checksums@3.1000.23'
  - '@aws-sdk/client-s3@3.1098.0'
  - '@aws-sdk/core@3.977.3'
  - '@aws-sdk/credential-provider-env@3.972.64'
  - '@aws-sdk/credential-provider-http@3.972.66'
  - '@aws-sdk/credential-provider-ini@3.973.9'
  - '@aws-sdk/credential-provider-login@3.972.71'
  - '@aws-sdk/credential-provider-node@3.972.75'
  - '@aws-sdk/credential-provider-process@3.972.64'
  - '@aws-sdk/credential-provider-sso@3.973.8'
  - '@aws-sdk/credential-provider-web-identity@3.972.70'
  - '@aws-sdk/middleware-sdk-s3@3.972.69'
  - '@aws-sdk/nested-clients@3.997.38'
  - '@aws-sdk/s3-request-presigner@3.1098.0'
  - '@aws-sdk/signature-v4-multi-region@3.996.43'
  - '@aws-sdk/token-providers@3.1098.0'
  - '@smithy/core@3.31.1'
  - '@smithy/credential-provider-imds@4.4.16'
  - '@smithy/fetch-http-handler@5.6.13'
  - '@smithy/node-http-handler@4.9.13'
  - '@smithy/signature-v4@5.6.12'

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# `tslib` 1.x n'a pas `__spreadArray`, que Lighthouse appelle : sans cette
# resolution, tous les audits de performance sortent en erreur
# « tslib_1.__spreadArray is not a function » et le score de la categorie devient
# nul. C'est une collision de dependance transitive, pas un choix de stack.
overrides:
  tslib: ^2.8.1
